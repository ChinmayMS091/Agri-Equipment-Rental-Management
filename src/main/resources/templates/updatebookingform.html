          // see full list of required and optional parameters:

          var request = new XMLHttpRequest();
          request.open('GET', request_url, true);

          request.onload = function() {
            // see full list of possible response codes:
            // https://opencagedata.com/api#codes

            if (request.status === 200){
              // Success!
              var data = JSON.parse(request.responseText);
              alert(data.results[0].formatted); // print the location
        var lat=data.results[0].geometry.lat;
        var lng=data.results[0].geometry.lng;
 var lattlong = new google.maps.LatLng(lat, lng); 
        

document.getElementById("latitude").value=lat;
 document.getElementById("longitude").value=lng ;




        console.log(data);

        console.log(lng);
initialize(lat,lng) ;


            } else if (request.status <= 500){
              // We reached our target server, but it returned an error

              console.log("unable to geocode! Response code: " + request.status);
              var data = JSON.parse(request.responseText);
              console.log('error msg: ' + data.status.message);
            } else {
              console.log("server error");
            }
          };

          request.onerror = function() {
            // There was a connection error of some sort
            console.log("unable to connect to server");
          };

          request.send();  // make the request









}




 </script> 


<script type="text/javascript">
function initialize(lat,lng) 
{
	



// put latitude and longitude data here
   var latinfo = new google.maps.LatLng(lat,lng);
   var map = new google.maps.Map(document.getElementById('map'), {
      center: latinfo,
      zoom: 13
    });
    var marker = new google.maps.Marker({
      map: map,
      position: latinfo,
      draggable: false,
      animation: google.maps.Animation.BOUNCE,
      anchorPoint: new google.maps.Point(0, -29)
   });
    var infowindow = new google.maps.InfoWindow();   
    google.maps.event.addListener(marker, 'click', function() 
    {
      var iwContent = '<div id="pop_window">' + '<div><b>Location</b> : Connaught Place, New Delhi</div></div>';
      // put content to the infowindow
      infowindow.setContent(iwContent);
      // show infowindow in the google map and at the current marker location
      infowindow.open(map, marker);
    });
}
google.maps.event.addDomListener(window, 'load', initialize);
</script>
