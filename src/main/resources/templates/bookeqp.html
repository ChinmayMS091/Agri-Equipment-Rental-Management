<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

					
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

</head>

<body onload="rand()">
<div class="container my-5">
    <h3> Book Equipment </h3>
    <div class="card">
        <div class="card-body">
            <div class="col-md-8">
					
										<form action="#" th:action="@{/book/{userId}    (userId=${userdata.userId})}" th:object="${vlist}" method="post">
                 
                 
                 
                 
                 
                 			
											<div class="form-group">
									<label>VendorID</label>
										<input type="text" th:value="${vlist.userId}"             name="vuser"     id="vuser"  class="form-control"    placeholder="TutorName"  required>
									</div>
										
										
										
										<div class="form-group">
									<label>VendorName</label>
										<input type="text" th:value="${vlist.VendorName}"         name="VendorName"   id="VendorName" class="form-control"    placeholder="TutorName"  required>
									</div>
				
							<div class="form-group">
									<label>VendorAddress</label>
										<input type="text" th:value="${vlist.VendorAddress}"         name="VendorAddress"         id="VendorAddress"      class="form-control"    placeholder="Address"  required>
									</div>
				
				
				<div class="form-group">
									<label>VContactNumber</label>
										<input type="text" th:value="${vlist.VContactNumber}"      name="VContactNumber"       id="VContactNumber"               class="form-control"    placeholder="ContactNumber"  required>
									</div>
				
							
                 
                 
                 
                 
                 
										<div class="form-group">
									<label>User Name</label>
										<input type="text"  class="form-control"  th:value="${userdata.Name}" name="Uname"  id="Uname"  placeholder="ContactNumber"  required>
									</div>
									
									
									
										<div class="form-group">
									<label>User ContactNumber</label>
										<input type="text"  class="form-control"   th:value="${userdata.Contactnumber}"  name="UContactNumber"  id="UContactNumber" placeholder="ContactNumber"  required>
									</div>
				
									
										<div class="form-group">
									<label>User Address</label>
										<input type="text"  class="form-control"   th:value="${userdata.Address}"  name="UAddress"  id="UAddress"   placeholder="UAddress"  required>
									</div>
				
									
				
				
				
				
				
				
													
								
					
									<div class="form-group">
									<label>Equipment Name</label>
										<input type="text"  class="form-control"   th:value="${eqplist.eqName}"  name="EqpName" id="EqpName"  placeholder="EqpName  required">
									</div>
								
					
					
					
									<div class="form-group">
									<label>Equipment Description</label>
										<input type="text"  class="form-control"   th:value="${eqplist.eqpdesc}"  name="eqpdesc" id="eqpdesc"  placeholder="eqpdesc">
									</div>
								
					
					<div class="form-group">
									<label>Price per Hr</label>
										<input type="text"  class="form-control"   th:value="${eqplist.price}"  name="price" id="price"  placeholder="eqpdesc">
									</div>
								
					
					
					
												
										
											<div class="form-group">
									<label>latitude</label>
										<input type="text"  class="form-control"   th:value="${eqplist.latitude}"  name="latitude" id="latitude"   placeholder="ContactNumber"  required>
									</div>
								
				
				
											<div class="form-group">
									<label>longitude</label>
										<input type="text"  class="form-control"   th:value="${eqplist.longitude}"  name="longitude" id="longitude"  placeholder="ContactNumber"  required>
									</div>
								
					
								
				
				
				<div class="form-group">
									<label>Equipment  Address</label>
										<input type="text"  class="form-control"   th:value="${eqplist.eqAddress}"  name="MyEqpAddress" id="MyEqpAddress" placeholder="ContactNumber"  required>
									</div>
					
					<div class="form-group">
									<label>Status</label>
										<input type="hidden"  class="form-control"   value="pending" name="Status"  placeholder="Status"  required>
									</div>
				
				
				
				<div class="form-group">
									<label>Equipment photo name</label>
										<input type="text"  class="form-control"   th:value="${eqplist.sphoto}"  name="sphoto"  required>
									</div>
	
	
		<div class="form-group">
									<label>Equipment Id</label>
										<input type="text"  class="form-control"   th:value="${eqplist.randomid}"  name="randomid" id="randomid" required>
									</div>
	
	
	
	
		<div class="form-group">
									<label>Booking No</label>
										<input type="text"  class="form-control"  id="bookingno"    name="bookingno"  placeholder="Booking No"  required>
									</div>
	
	
	
							
			<div class="row">
			<div class="col-sm-8 col-sm-offset-2">
				<button type="submit" name="submit" class="btn-primary btn">Book</button>

			</div>
		</div>
					
					</form>
					
					</div>
        </div>
    </div>
</div>
</body>

</html>
