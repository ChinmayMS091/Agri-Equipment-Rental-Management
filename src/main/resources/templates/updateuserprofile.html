<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

					
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Update User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css" integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
</head>

<body>
<div class="container my-5">
    <h3> Update User </h3>
    <div class="card">
        <div class="card-body">
            <div class="col-md-8">
					
										<form action="#" th:action="@{/userupdateprofile/{userId}    (userId=${userlist.userId})}" th:object="${userlist}" method="post">
                 
										<div class="form-group">
									<label>User Id</label>
										<input type="text" th:field="*{userId}" class="form-control"    id="name" placeholder="Name"  required>
									</div>
				
				
				<div class="form-group">
									<label>password</label>
										<input type="text" th:field="*{password}" class="form-control"    id="name" placeholder="Name"  required>
									</div>
									
									
									
						<div class="form-group">
									<label>Name</label>
										<input type="text" th:field="*{name}" class="form-control"    id="name" placeholder="Name"  required>
									</div>
							
							
							
						<div class="form-group">
									<label>Address</label>
										<input type="text" th:field="*{address}" class="form-control"    id="name" placeholder="Name"  required>
									</div>
							
                      
								<div class="form-group">
									<label>Contact Number</label>
										<input type="text" th:field="*{contactnumber}" class="form-control" id="phoneNo" placeholder="contactNumber"required>
									</div>
								
                       <div class="form-group">
									<label>Email </label>
										<input type="text" th:field="*{emailto}" class="form-control" id="emailto" placeholder="contactNumber"required>
									</div>
								       		
                              		
                  
											
	
			<div class="row">
			<div class="col-sm-8 col-sm-offset-2">
				<button type="submit" name="submit" class="btn-primary btn">Update</button>

			</div>
		</div>
					
					</form>
					
					</div>
        </div>
    </div>
</div>
</body>

</html>
						
	</html>
